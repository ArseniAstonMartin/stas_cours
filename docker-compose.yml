version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: exam-prep-db
    environment:
      POSTGRES_DB: exam_prep
      POSTGRES_USER: exam_user
      POSTGRES_PASSWORD: exam_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U exam_user -d exam_prep"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: exam-prep-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
